name: HumanWill immutable amd64 release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Complete 40-character source commit SHA"
        required: true
        type: string
      version:
        description: "New immutable SemVer (without a moving tag)"
        required: true
        type: string

concurrency:
  group: humanwill-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hubyuan/sub2api

jobs:
  release:
    # Keep this workflow fork-owned. It is never a production deployment or
    # an upstream release trigger.
    if: github.repository == 'hubyuan/sub2api'
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate immutable release inputs
        id: validate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_sha must be a complete 40-character SHA" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "version must be an immutable SemVer" >&2; exit 1; }
          case "$VERSION" in latest|edge|stable|main|master|v*) echo "moving/reserved version is not allowed" >&2; exit 1;; esac
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "${SOURCE_SHA,,}" ]] || { echo "checked out commit does not match source_sha" >&2; exit 1; }
          git cat-file -e "$ACTUAL_SHA^{commit}"
          echo "source_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing version
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if output="$(docker manifest inspect "${IMAGE}:${VERSION}" 2>&1)"; then
            echo "Version ${VERSION} already exists; refusing to overwrite" >&2
            exit 1
          fi
          if grep -Eiq 'manifest unknown|no such manifest|not found' <<< "$output"; then
            echo "Version ${VERSION} is available"
          else
            echo "Unable to prove version absence; registry check failed closed" >&2
            echo "$output" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.validate.outputs.version }}
          build-args: |
            VERSION=${{ steps.validate.outputs.version }}
            COMMIT=${{ steps.validate.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/hubyuan/sub2api
            org.opencontainers.image.revision=${{ steps.validate.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.validate.outputs.version }}
          cache-from: type=gha,scope=humanwill-amd64
          cache-to: type=gha,mode=max,scope=humanwill-amd64

      - name: Write immutable release summary
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          SOURCE_SHA: ${{ steps.validate.outputs.source_sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          {
            echo "## HumanWill immutable image"
            echo
            echo "- Image: \`${IMAGE}:${VERSION}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Digest: \`${IMAGE}@${DIGEST}\`"
            echo "- OCI revision/version labels: \`${SOURCE_SHA}\` / \`${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
