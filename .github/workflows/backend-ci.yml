name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check immutable release and application-only Compose
        run: |
          git fetch --no-tags https://github.com/Wei-Shaw/sub2api.git 073e92d17178a1ccdb0a27017f572f10c9c7ab62
          python3 -m py_compile tools/check_humanwill_release.py tools/check_upstream_provenance.py tools/mock_openai_upstream.py tools/container_resource_sampler.py
          python3 tools/check_humanwill_release.py
          python3 tools/check_upstream_provenance.py
          docker compose -f deploy/docker-compose.humanwill.example.yml config --no-interpolate >/dev/null

  low-resource-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: audit-only-admin-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - name: Create isolated database role/database and Redis sentinel
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE sub2api_audit LOGIN PASSWORD 'audit-only-app-password'" >/dev/null
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE sub2api_audit OWNER sub2api_audit" >/dev/null
          docker exec "$REDIS_CONTAINER" redis-cli -n 0 SET humanwill:audit:sentinel untouched >/dev/null
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 audit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: sub2api-humanwill-audit:ci
          build-args: |
            GOLANG_IMAGE=golang:1.26.6-alpine
            VERSION=0.0.0-audit
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=humanwill-runtime-audit
          cache-to: type=gha,mode=max,scope=humanwill-runtime-audit
      - name: Audit production-shape migration and application rollback compatibility
        timeout-minutes: 15
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
          CURRENT_IMAGE: ghcr.io/hubyuan/sub2api@sha256:dcf36d1d00db16355e85ba1c50163bc02f6054bfef9bcc59fa876c34d5f0aa73
        run: |
          set -euo pipefail
          container=sub2api-upgrade-audit
          volume=sub2api-upgrade-audit-data
          mock_pid=""
          cleanup() {
            if [ -n "$mock_pid" ] && kill -0 "$mock_pid" 2>/dev/null; then kill "$mock_pid" 2>/dev/null || true; fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            docker exec "$REDIS_CONTAINER" redis-cli -n 10 FLUSHDB >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_for_upgrade_health() {
            for attempt in $(seq 1 90); do
              if curl --silent --fail http://127.0.0.1:18081/health >/dev/null; then return; fi
              if [ "$attempt" -eq 90 ]; then docker logs --tail=100 "$container"; return 1; fi
              sleep 1
            done
          }
          create_upgrade_container() {
            local image="$1"
            local auto_setup="$2"
            docker create --name "$container" --network host \
              --cpus 2 --memory 2g --memory-swap 2g --pids-limit 512 \
              --ulimit nofile=65536:65536 \
              --volume "$volume":/app/data \
              -e RUN_MODE=simple -e AUTO_SETUP="$auto_setup" -e DATA_DIR=/app/data \
              -e TZ=America/New_York \
              -e SERVER_HOST=127.0.0.1 -e SERVER_PORT=18081 \
              -e DATABASE_HOST=127.0.0.1 -e DATABASE_PORT=55432 \
              -e DATABASE_USER=sub2api_upgrade -e DATABASE_PASSWORD=audit-only-upgrade-password \
              -e DATABASE_DBNAME=sub2api_upgrade -e DATABASE_SSLMODE=disable \
              -e REDIS_HOST=127.0.0.1 -e REDIS_PORT=56379 -e REDIS_DB=10 \
              -e ADMIN_EMAIL=upgrade@example.invalid -e ADMIN_PASSWORD=audit-only-admin-password \
              -e JWT_SECRET=audit-only-upgrade-jwt-secret-at-least-32-characters \
              "$image" >/dev/null
          }

          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE sub2api_upgrade LOGIN PASSWORD 'audit-only-upgrade-password'" >/dev/null
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE sub2api_upgrade OWNER sub2api_upgrade" >/dev/null
          docker volume create "$volume" >/dev/null
          docker pull "$CURRENT_IMAGE"
          python3 tools/mock_openai_upstream.py \
            --port 19091 --state-file "$RUNNER_TEMP/sub2api-upgrade-mock-state" \
            >"$RUNNER_TEMP/sub2api-upgrade-mock.log" 2>&1 &
          mock_pid=$!

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:19091/health >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat "$RUNNER_TEMP/sub2api-upgrade-mock.log"; exit 1; fi
            sleep 1
          done

          create_upgrade_container "$CURRENT_IMAGE" true
          docker start "$container" >/dev/null
          wait_for_upgrade_health
          docker stop --time 10 "$container" >/dev/null
          docker rm "$container" >/dev/null

          actual_185_checksum="$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT checksum FROM schema_migrations WHERE filename = '185_add_openai_responses_early_event.sql'" | tr -d '\r')"
          actual_220_checksum="$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT checksum FROM schema_migrations WHERE filename = '220_clear_non_grok_video_generation_config.sql'" | tr -d '\r')"
          test "$actual_185_checksum" = f27a4a07e9692c9c0659797e0fb9b7e0c221959284bd27fd097b6c6b5f05bc0f
          test "$actual_220_checksum" = 4595baeb0dab0fd05be15da4e8f0dcf9f8e7d0ca36d60d00d223fca9bef03625
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT COUNT(*) FROM schema_migrations WHERE filename IN ('221_group_model_pricing.sql', '222_group_usage_daily_rollups.sql', '223_group_usage_rollup_timezone.sql', '224_add_openai_responses_compatibility.sql')" | tr -d '\r')" = 0
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -At \
            -c "SELECT filename || E'\\t' || checksum FROM schema_migrations ORDER BY filename" \
            >"$RUNNER_TEMP/sub2api-upgrade-prior-migrations.tsv"
          prior_migration_count="$(wc -l < "$RUNNER_TEMP/sub2api-upgrade-prior-migrations.tsv")"

          create_upgrade_container sub2api-humanwill-audit:ci false
          docker start "$container" >/dev/null
          wait_for_upgrade_health
          docker stop --time 10 "$container" >/dev/null
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT COUNT(*) FROM schema_migrations WHERE filename IN ('221_group_model_pricing.sql', '222_group_usage_daily_rollups.sql', '223_group_usage_rollup_timezone.sql', '224_add_openai_responses_compatibility.sql')" | tr -d '\r')" = 4
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT checksum FROM schema_migrations WHERE filename = '224_add_openai_responses_compatibility.sql'" | tr -d '\r')" = f27a4a07e9692c9c0659797e0fb9b7e0c221959284bd27fd097b6c6b5f05bc0f
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'groups' AND column_name IN ('long_context_pricing_enabled', 'model_pricing')" | tr -d '\r')" = 2
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('usage_group_daily_rollups', 'usage_group_rollup_state')" | tr -d '\r')" = 2
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = 'public' AND (table_name, column_name) IN (('api_keys', 'openai_responses_stream_event_mode'), ('usage_logs', 'first_sse_event_ms'))" | tr -d '\r')" = 2
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -At \
            -c "SELECT filename || E'\\t' || checksum FROM schema_migrations WHERE filename NOT IN ('221_group_model_pricing.sql', '222_group_usage_daily_rollups.sql', '223_group_usage_rollup_timezone.sql', '224_add_openai_responses_compatibility.sql') ORDER BY filename" \
            >"$RUNNER_TEMP/sub2api-upgrade-after-migrations.tsv"
          cmp "$RUNNER_TEMP/sub2api-upgrade-prior-migrations.tsv" "$RUNNER_TEMP/sub2api-upgrade-after-migrations.tsv"

          # A second startup must be idempotent and retain every migration row.
          docker start "$container" >/dev/null
          wait_for_upgrade_health
          docker stop --time 10 "$container" >/dev/null
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT COUNT(*) FROM schema_migrations" | tr -d '\r')" = "$((prior_migration_count + 4))"

          docker start "$container" >/dev/null
          wait_for_upgrade_health
          login_response="$(curl --silent --show-error --fail-with-body \
            -H 'Content-Type: application/json' \
            -d '{"email":"upgrade@example.invalid","password":"audit-only-admin-password"}' \
            http://127.0.0.1:18081/api/v1/auth/login)"
          admin_token="$(jq -er '.data.access_token' <<<"$login_response")"
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $admin_token" -H 'Content-Type: application/json' \
            -d '{"phrase":"I have read, understood, and agree to the Sub2API Deployment and Operation Compliance Commitment","language":"en"}' \
            http://127.0.0.1:18081/api/v1/admin/compliance/accept \
            | jq -e '.code == 0 and .data.required == false' >/dev/null
          groups_response="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $admin_token" \
            http://127.0.0.1:18081/api/v1/groups/available)"
          openai_group_id="$(jq -er 'first(.data[] | select(.platform == "openai")).id' <<<"$groups_response")"
          account_payload="$(jq -nc --argjson group_id "$openai_group_id" '{name:"upgrade-mock-openai",platform:"openai",type:"apikey",credentials:{api_key:"audit-only-upstream-key",base_url:"http://127.0.0.1:19091/v1"},concurrency:1,priority:1,group_ids:[$group_id]}')"
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $admin_token" -H 'Content-Type: application/json' \
            -d "$account_payload" http://127.0.0.1:18081/api/v1/admin/accounts \
            | jq -e '.code == 0 and .data.id > 0' >/dev/null

          for attempt in $(seq 1 30); do
            if grep -q '^probe-completed$' "$RUNNER_TEMP/sub2api-upgrade-mock-state"; then break; fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/sub2api-upgrade-mock-state"
              docker logs --tail=100 "$container"
              exit 1
            fi
            sleep 1
          done
          key_payload="$(jq -nc --argjson group_id "$openai_group_id" '{name:"upgrade-audit",custom_key:"sk-audit-only-upgrade-key",group_id:$group_id}')"
          key_response="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $admin_token" -H 'Content-Type: application/json' \
            -d "$key_payload" http://127.0.0.1:18081/api/v1/keys)"
          application_key="$(jq -er '.data.key' <<<"$key_response")"
          test "$application_key" = sk-audit-only-upgrade-key
          curl --silent --show-error --fail-with-body --no-buffer --max-time 30 \
            -H "Authorization: Bearer $application_key" -H 'Content-Type: application/json' \
            -d '{"model":"gpt-5.4","input":"AUDIT_FAST_STREAM","stream":true}' \
            http://127.0.0.1:18081/v1/responses \
            | tee "$RUNNER_TEMP/sub2api-upgrade-new-responses.sse" >/dev/null
          grep -q 'response.completed' "$RUNNER_TEMP/sub2api-upgrade-new-responses.sse"
          for attempt in $(seq 1 30); do
            usage_log_id="$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
              "SELECT id FROM usage_logs WHERE group_id = ${openai_group_id} ORDER BY id DESC LIMIT 1" | tr -d '\r')"
            if [ -n "$usage_log_id" ]; then break; fi
            test "$attempt" -ne 30
            sleep 1
          done
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -v ON_ERROR_STOP=1 \
            -c "UPDATE usage_logs SET actual_cost = 3, created_at = ((((CURRENT_TIMESTAMP AT TIME ZONE 'America/New_York')::date - 2)::timestamp + TIME '00:30') AT TIME ZONE 'America/New_York') WHERE id = ${usage_log_id}" >/dev/null
          docker stop --time 10 "$container" >/dev/null

          # Startup aggregation must rebuild historical buckets in configured TZ and publish the watermark last.
          docker start "$container" >/dev/null
          wait_for_upgrade_health
          for attempt in $(seq 1 60); do
            rollup_ready="$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
              "SELECT EXISTS (SELECT 1 FROM usage_group_daily_rollups WHERE bucket_date = (CURRENT_TIMESTAMP AT TIME ZONE 'America/New_York')::date - 2 AND group_id = ${openai_group_id} AND actual_cost = 3)" | tr -d '\r')"
            if [ "$rollup_ready" = t ]; then break; fi
            if [ "$attempt" -eq 60 ]; then docker logs --tail=100 "$container"; exit 1; fi
            sleep 1
          done
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT timezone_name = 'America/New_York' AND closed_before = (CURRENT_TIMESTAMP AT TIME ZONE 'America/New_York')::date FROM usage_group_rollup_state WHERE id = 1" | tr -d '\r')" = t
          rollup_snapshot="$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -Atc \
            "SELECT bucket_date, group_id, actual_cost FROM usage_group_daily_rollups ORDER BY bucket_date, group_id")"
          docker stop --time 10 "$container" >/dev/null
          docker start "$container" >/dev/null
          wait_for_upgrade_health
          sleep 5
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -Atc \
            "SELECT bucket_date, group_id, actual_cost FROM usage_group_daily_rollups ORDER BY bucket_date, group_id")" = "$rollup_snapshot"
          docker stop --time 10 "$container" >/dev/null
          docker rm "$container" >/dev/null

          create_upgrade_container "$CURRENT_IMAGE" false
          docker start "$container" >/dev/null
          wait_for_upgrade_health
          old_login_response="$RUNNER_TEMP/sub2api-upgrade-old-login.json"
          old_login_status="$(curl --silent --show-error --output "$old_login_response" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"email":"upgrade@example.invalid","password":"audit-only-admin-password"}' \
            http://127.0.0.1:18081/api/v1/auth/login || true)"
          if [ "$old_login_status" != 200 ] || ! jq -e '.data.access_token | strings | length > 0' "$old_login_response" >/dev/null; then
            echo "Rollback image login failed: status=$old_login_status" >&2
            if jq -e . "$old_login_response" >/dev/null 2>&1; then
              jq -c '{code, message, error: (if (.error | type) == "object" then {type: .error.type, code: .error.code, message: .error.message} else .error end)}' "$old_login_response" >&2
            else
              echo "Rollback image login returned non-JSON: bytes=$(wc -c < "$old_login_response")" >&2
            fi
            docker logs --tail=100 "$container" >&2 || true
            exit 1
          fi
          usage_count_before="$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT COUNT(*) FROM usage_logs" | tr -d '\r')"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -v ON_ERROR_STOP=1 \
            -c "UPDATE usage_group_rollup_state SET closed_before = (CURRENT_TIMESTAMP AT TIME ZONE 'America/New_York')::date + 1 WHERE id = 1" >/dev/null
          curl --silent --show-error --fail-with-body --no-buffer --max-time 30 \
            -H "Authorization: Bearer $application_key" -H 'Content-Type: application/json' \
            -d '{"model":"gpt-5.4","input":"AUDIT_FAST_STREAM","stream":true}' \
            http://127.0.0.1:18081/v1/responses \
            | tee "$RUNNER_TEMP/sub2api-upgrade-old-responses.sse" >/dev/null
          grep -q 'response.completed' "$RUNNER_TEMP/sub2api-upgrade-old-responses.sse"
          for attempt in $(seq 1 30); do
            usage_count_after="$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
              "SELECT COUNT(*) FROM usage_logs" | tr -d '\r')"
            if [ "$usage_count_after" -gt "$usage_count_before" ]; then break; fi
            test "$attempt" -ne 30
            sleep 1
          done
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT COUNT(*) FROM pg_trigger WHERE NOT tgisinternal AND tgname IN ('usage_logs_group_rollup_invalidate_insert', 'usage_logs_group_rollup_invalidate_delete', 'usage_logs_group_rollup_invalidate_update')" | tr -d '\r')" = 3
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_upgrade -tAc \
            "SELECT closed_before = (CURRENT_TIMESTAMP AT TIME ZONE 'America/New_York')::date FROM usage_group_rollup_state WHERE id = 1" | tr -d '\r')" = t
          docker stop --time 10 "$container" >/dev/null
      - name: Audit isolated simple-mode lifecycle and minimum smoke profile
        id: runtime
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          set -euo pipefail
          audit_dir="$RUNNER_TEMP/sub2api-runtime-audit"
          mkdir -p "$audit_dir"
          mock_state="$audit_dir/mock-state"
          sampler_pid=""
          mock_pid=""
          stream_pid=""
          cleanup() {
            for pid in "$sampler_pid" "$stream_pid" "$mock_pid"; do
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then kill "$pid" 2>/dev/null || true; fi
            done
            docker rm -f sub2api-humanwill-audit sub2api-humanwill-smoke >/dev/null 2>&1 || true
            docker volume rm sub2api-humanwill-audit-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          start_sampler() {
            local phase="$1"
            python3 tools/container_resource_sampler.py \
              --container sub2api-humanwill-audit \
              --output "$audit_dir/${phase}.json" --interval 1 &
            sampler_pid=$!
          }
          stop_sampler() {
            local phase="$1"
            kill -TERM "$sampler_pid"
            wait "$sampler_pid"
            sampler_pid=""
            test "$(jq -r '.sample_count > 0' "$audit_dir/${phase}.json")" = true
          }
          wait_for_health() {
            for attempt in $(seq 1 90); do
              if curl --silent --fail http://127.0.0.1:18080/health >/dev/null; then return; fi
              if [ "$attempt" -eq 90 ]; then
                docker logs --tail=100 sub2api-humanwill-audit || true
                return 1
              fi
              sleep 1
            done
          }

          python3 tools/mock_openai_upstream.py \
            --port 19090 --state-file "$mock_state" >"$audit_dir/mock.log" 2>&1 &
          mock_pid=$!
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:19090/health >/dev/null; then break; fi
            test "$attempt" -ne 30
            sleep 1
          done

          docker volume create sub2api-humanwill-audit-data >/dev/null
          docker create --name sub2api-humanwill-audit --network host \
            --cpus 2 --memory 2g --memory-swap 2g --pids-limit 512 \
            --ulimit nofile=65536:65536 \
            --volume sub2api-humanwill-audit-data:/app/data \
            -e RUN_MODE=simple -e AUTO_SETUP=true -e DATA_DIR=/app/data \
            -e SERVER_HOST=127.0.0.1 -e SERVER_PORT=18080 \
            -e DATABASE_HOST=127.0.0.1 -e DATABASE_PORT=55432 \
            -e DATABASE_USER=sub2api_audit -e DATABASE_PASSWORD=audit-only-app-password \
            -e DATABASE_DBNAME=sub2api_audit -e DATABASE_SSLMODE=disable \
            -e REDIS_HOST=127.0.0.1 -e REDIS_PORT=56379 -e REDIS_DB=9 \
            -e ADMIN_EMAIL=audit@example.invalid -e ADMIN_PASSWORD=audit-only-admin-password \
            -e JWT_SECRET=audit-only-jwt-secret-at-least-32-characters \
            sub2api-humanwill-audit:ci >/dev/null

          test "$(docker image inspect --format '{{.Architecture}}' sub2api-humanwill-audit:ci)" = amd64
          test "$(docker inspect --format '{{.HostConfig.NanoCpus}}' sub2api-humanwill-audit)" = 2000000000
          test "$(docker inspect --format '{{.HostConfig.Memory}}' sub2api-humanwill-audit)" = 2147483648
          test "$(docker inspect --format '{{.HostConfig.MemorySwap}}' sub2api-humanwill-audit)" = 2147483648
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' sub2api-humanwill-audit)" = 512
          test "$(docker inspect --format '{{range .HostConfig.Ulimits}}{{if eq .Name "nofile"}}{{.Soft}}:{{.Hard}}{{end}}{{end}}' sub2api-humanwill-audit)" = 65536:65536

          start_sampler migration
          docker start sub2api-humanwill-audit >/dev/null
          wait_for_health
          stop_sampler migration

          start_sampler management
          login_response="$(curl --silent --show-error --fail-with-body \
            -H 'Content-Type: application/json' \
            -d '{"email":"audit@example.invalid","password":"audit-only-admin-password"}' \
            http://127.0.0.1:18080/api/v1/auth/login)"
          admin_token="$(jq -er '.data.access_token' <<<"$login_response")"
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $admin_token" -H 'Content-Type: application/json' \
            -d '{"phrase":"I have read, understood, and agree to the Sub2API Deployment and Operation Compliance Commitment","language":"en"}' \
            http://127.0.0.1:18080/api/v1/admin/compliance/accept \
            | jq -e '.code == 0 and .data.required == false' >/dev/null
          groups_response="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $admin_token" \
            http://127.0.0.1:18080/api/v1/groups/available)"
          openai_group_id="$(jq -er 'first(.data[] | select(.platform == "openai")).id' <<<"$groups_response")"
          account_payload="$(jq -nc --argjson group_id "$openai_group_id" '{name:"mock-openai",platform:"openai",type:"apikey",credentials:{api_key:"audit-only-upstream-key",base_url:"http://127.0.0.1:19090/v1"},concurrency:1,priority:1,group_ids:[$group_id]}')"
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $admin_token" -H 'Content-Type: application/json' \
            -d "$account_payload" http://127.0.0.1:18080/api/v1/admin/accounts \
            | jq -e '.code == 0 and .data.id > 0' >/dev/null
          key_payload="$(jq -nc --argjson group_id "$openai_group_id" '{name:"runtime-audit",custom_key:"sk-audit-only-application-key",group_id:$group_id}')"
          key_response="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $admin_token" -H 'Content-Type: application/json' \
            -d "$key_payload" http://127.0.0.1:18080/api/v1/keys)"
          application_key="$(jq -er '.data.key' <<<"$key_response")"
          test "$application_key" = sk-audit-only-application-key
          stop_sampler management

          for attempt in $(seq 1 30); do
            if grep -q '^probe-completed$' "$mock_state"; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo 'OpenAI Responses capability probe did not complete' >&2
              sed -n '1,40p' "$mock_state" >&2
              docker logs --tail=100 sub2api-humanwill-audit >&2 || true
              exit 1
            fi
            sleep 1
          done
          sleep 2
          request_fast_stream() {
            local route="$1"
            local output="$2"
            local status=""
            for attempt in $(seq 1 20); do
              status="$(curl --silent --show-error --no-buffer --max-time 30 \
                --output "$output" --write-out '%{http_code}' \
                -H "Authorization: Bearer $application_key" -H 'Content-Type: application/json' \
                -d '{"model":"gpt-5.4","input":"AUDIT_FAST_STREAM","stream":true}' \
                "http://127.0.0.1:18080${route}" || true)"
              if [ "$status" = 200 ]; then return; fi
              sleep 1
            done
            echo "Authenticated stream failed: route=${route} status=${status}" >&2
            sed -n '1,20p' "$output" >&2
            echo 'Mock state:' >&2
            sed -n '1,40p' "$mock_state" >&2
            return 1
          }
          start_sampler streaming
          request_fast_stream /v1/responses "$audit_dir/responses.sse"
          request_fast_stream /backend-api/codex/responses "$audit_dir/codex.sse"
          stop_sampler streaming
          for output in "$audit_dir/responses.sse" "$audit_dir/codex.sse"; do
            grep -q 'response.created' "$output"
            grep -q 'response.output_text.delta' "$output"
            grep -q 'response.completed' "$output"
            grep -q 'audit-ok' "$output"
          done

          maintenance_schema_absent="$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d postgres -tAc "SELECT to_regclass('public.schema_migrations') IS NULL" | tr -d '\r')"
          migration_count="$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_audit -tAc "SELECT COUNT(*) FROM schema_migrations" | tr -d '\r')"
          migration_220_zero_backup_count="$(docker exec "$POSTGRES_CONTAINER" psql -U postgres -d sub2api_audit -tAc "SELECT COUNT(*) FROM groups_video_price_backup_220" | tr -d '\r')"
          redis_sentinel="$(docker exec "$REDIS_CONTAINER" redis-cli -n 0 GET humanwill:audit:sentinel | tr -d '\r')"
          redis_db0_size="$(docker exec "$REDIS_CONTAINER" redis-cli -n 0 DBSIZE | tr -d '\r')"
          redis_db9_size="$(docker exec "$REDIS_CONTAINER" redis-cli -n 9 DBSIZE | tr -d '\r')"
          test "$maintenance_schema_absent" = t
          test "$migration_count" -gt 0
          test "$migration_220_zero_backup_count" = 0
          test "$redis_sentinel" = untouched
          test "$redis_db0_size" = 1
          test "$redis_db9_size" -gt 0
          for redis_db in 1 2 3 4 5 6 7 8 10 11 12 13 14 15; do
            test "$(docker exec "$REDIS_CONTAINER" redis-cli -n "$redis_db" DBSIZE | tr -d '\r')" = 0
          done

          python3 tools/container_resource_sampler.py \
            --container sub2api-humanwill-audit \
            --output "$audit_dir/idle.json" --interval 5 --duration 300

          idle_stop_started="$(date +%s%3N)"
          docker stop --time 10 sub2api-humanwill-audit >/dev/null
          idle_stop_ms="$(( $(date +%s%3N) - idle_stop_started ))"
          idle_exit_code="$(docker inspect --format '{{.State.ExitCode}}' sub2api-humanwill-audit)"
          test "$idle_exit_code" = 0
          docker start sub2api-humanwill-audit >/dev/null
          wait_for_health

          start_sampler stream-shutdown
          set +e
          curl --silent --show-error --fail-with-body --no-buffer --max-time 40 \
            -H "Authorization: Bearer $application_key" -H 'Content-Type: application/json' \
            -d '{"model":"gpt-5.4","input":"AUDIT_SLOW_STREAM","stream":true}' \
            http://127.0.0.1:18080/v1/responses >"$audit_dir/slow.sse" 2>"$audit_dir/slow-curl.log" &
          stream_pid=$!
          set -e
          for attempt in $(seq 1 20); do
            if grep -q '^slow-started$' "$mock_state" && grep -q 'response.created' "$audit_dir/slow.sse"; then break; fi
            test "$attempt" -ne 20
            sleep 1
          done
          stream_stop_started="$(date +%s%3N)"
          docker stop --time 10 sub2api-humanwill-audit >/dev/null
          stream_stop_ms="$(( $(date +%s%3N) - stream_stop_started ))"
          stream_exit_code="$(docker inspect --format '{{.State.ExitCode}}' sub2api-humanwill-audit)"
          test "$stream_exit_code" = 0
          set +e
          wait "$stream_pid"
          stream_curl_status=$?
          set -e
          stream_pid=""
          stop_sampler stream-shutdown
          if grep -q 'response.completed' "$audit_dir/slow.sse"; then
            stream_outcome=completed
          else
            grep -q 'response.created' "$audit_dir/slow.sse"
            stream_outcome=interrupted
          fi

          docker run -d --name sub2api-humanwill-smoke --network host \
            --cpus 0.5 --memory 512m --memory-swap 512m --pids-limit 128 \
            --ulimit nofile=16384:16384 \
            --volume sub2api-humanwill-audit-data:/app/data \
            -e RUN_MODE=simple -e AUTO_SETUP=false -e DATA_DIR=/app/data \
            -e SERVER_HOST=127.0.0.1 -e SERVER_PORT=18080 \
            -e DATABASE_HOST=127.0.0.1 -e DATABASE_PORT=55432 \
            -e DATABASE_USER=sub2api_audit -e DATABASE_PASSWORD=audit-only-app-password \
            -e DATABASE_DBNAME=sub2api_audit -e DATABASE_SSLMODE=disable \
            -e REDIS_HOST=127.0.0.1 -e REDIS_PORT=56379 -e REDIS_DB=9 \
            -e JWT_SECRET=audit-only-jwt-secret-at-least-32-characters \
            sub2api-humanwill-audit:ci >/dev/null
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:18080/health >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then docker logs --tail=100 sub2api-humanwill-smoke; exit 1; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.HostConfig.NanoCpus}}' sub2api-humanwill-smoke)" = 500000000
          test "$(docker inspect --format '{{.HostConfig.Memory}}' sub2api-humanwill-smoke)" = 536870912
          test "$(docker inspect --format '{{.HostConfig.MemorySwap}}' sub2api-humanwill-smoke)" = 536870912
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' sub2api-humanwill-smoke)" = 128
          test "$(docker inspect --format '{{range .HostConfig.Ulimits}}{{if eq .Name "nofile"}}{{.Soft}}:{{.Hard}}{{end}}{{end}}' sub2api-humanwill-smoke)" = 16384:16384
          smoke_sample="$(docker stats --no-stream --format '{{.CPUPerc}} | {{.MemUsage}} | {{.PIDs}}' sub2api-humanwill-smoke)"
          docker stop --time 10 sub2api-humanwill-smoke >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' sub2api-humanwill-smoke)" = 0

          phase_summary() {
            local phase="$1"
            jq -r '"sample CPU/memory/PIDs " + (.samples[0].cpu_percent | tostring) + "%/" + ((.samples[0].memory_bytes / 1048576 * 100 | round) / 100 | tostring) + " MiB/" + (.samples[0].pids | tostring) + "; peaks " + (.cpu_peak_percent | tostring) + "%/" + ((.memory_peak_bytes / 1048576 * 100 | round) / 100 | tostring) + " MiB/" + (.pids_peak | tostring) + " (" + (.sample_count | tostring) + " samples)"' "$audit_dir/${phase}.json"
          }
          migration_summary="$(phase_summary migration)"
          idle_summary="$(phase_summary idle)"
          management_summary="$(phase_summary management)"
          streaming_summary="$(phase_summary streaming)"
          shutdown_summary="$(phase_summary stream-shutdown)"
          echo "Migration/startup: $migration_summary"
          echo "Five-minute idle: $idle_summary"
          echo "Management: $management_summary"
          echo "Authenticated streaming: $streaming_summary"
          echo "Stream-active shutdown: $shutdown_summary"
          echo "Isolation: maintenance_schema_absent=$maintenance_schema_absent migration_count=$migration_count migration_220_zero_backup_count=$migration_220_zero_backup_count redis_db0_size=$redis_db0_size redis_db9_size=$redis_db9_size"
          echo "SIGTERM: idle=${idle_stop_ms}ms active=${stream_stop_ms}ms stream_outcome=$stream_outcome curl_status=$stream_curl_status"
          {
            echo '### Low-resource runtime audit'
            echo
            echo '- PostgreSQL 16: dedicated role/database migration passed'
            echo '- Redis 7: DB 0 sentinel is unchanged and is its only key; application keys exist in DB 9 only'
            echo '- Production candidate effective limit: 2 vCPU, 2 GiB memory/swap, 512 PIDs, NOFILE 65536'
            echo "- Migration/startup: ${migration_summary}"
            echo "- Five-minute idle: ${idle_summary}"
            echo "- Management API operations: ${management_summary}"
            echo "- Authenticated mock streaming: ${streaming_summary}"
            echo "- Stream-active shutdown: ${shutdown_summary}"
            echo '- Routes: authenticated `/v1/responses` and `/backend-api/codex/responses` returned valid local-mock SSE terminal events'
            echo "- Idle SIGTERM: exit 0 in ${idle_stop_ms} ms"
            echo "- Active-stream SIGTERM: exit 0 in ${stream_stop_ms} ms; client stream ${stream_outcome} (curl status ${stream_curl_status})"
            echo "- Minimum smoke only: 0.5 vCPU, 512 MiB memory/swap, 128 PIDs, NOFILE 16384; sample ${smoke_sample}"
          } >> "$GITHUB_STEP_SUMMARY"

  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend lint, typecheck, tests, and build
        working-directory: frontend
        run: |
          pnpm run lint:check
          pnpm run typecheck
          pnpm run test:run
          pnpm run build

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend
